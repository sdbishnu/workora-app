services: 
  core-api: 
    build: 
      context: . 
      dockerfile: infra/docker/backend.Dockerfile 
    image: workora-core-api:dev 
    container_name: workora-core-api 
    environment: 
      NODE_ENV: development 
      HOST_NAME: 0.0.0.0 
      PORT: "3000" 
      TENANT_IS_ENABLED: "false" 
      DATABASE_HOST: postgres 
      DATABASE_PORT: "5432" 
      DATABASE_NAME: workora 
      DATABASE_USER: workora 
      DATABASE_PASSWORD: workora_dev 
      REDIS_HOST: redis 
      REDIS_PORT: "6379" 
    networks: 
      - workora 
    depends_on: 
      postgres: 
        condition: service_healthy 
      redis: 
        condition: service_healthy 
  postgres: 
    image: postgres:17-alpine 
    container_name: workora-postgres 
    restart: unless-stopped 
    environment: 
      POSTGRES_DB: workora 
      POSTGRES_USER: workora 
      POSTGRES_PASSWORD: workora_dev 
    ports: 
      - "5433:5432" 
    volumes: 
      - workora-postgres-data:/var/lib/postgresql/data 
    networks: 
      - workora 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U workora -d workora"] 
      interval: 5s 
      timeout: 5s 
      retries: 10 
  redis: 
    image: redis:8-alpine 
    container_name: workora-redis 
    restart: unless-stopped 
    command: redis-server --appendonly yes 
    ports: 
      - "6379:6379" 
    volumes: 
      - workora-redis-data:/data 
    networks: 
      - workora 
    healthcheck: 
      test: ["CMD", "redis-cli", "ping"] 
      interval: 5s 
      timeout: 5s 
      retries: 10 
networks: 
  workora: 
    name: workora-network 
volumes: 
  workora-postgres-data: 
    name: workora-postgres-data 
  workora-redis-data: 
    name: workora-redis-data 
